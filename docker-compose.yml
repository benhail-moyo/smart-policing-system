services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crime-watch-postgis
    environment:
      POSTGRES_DB: crime_watch
      POSTGRES_USER: crime_watch
      POSTGRES_PASSWORD: crime_watch
    ports:
      - "5432:5432"
    volumes:
      - crime_watch_pgdata:/var/lib/postgresql/data
      - ./infra/docker/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crime_watch -d crime_watch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crime-watch-backend
    environment:
      - DATABASE_URL=postgresql://crime_watch:crime_watch@db:5432/crime_watch
      - FLASK_ENV=development
      - FLASK_APP=wsgi.py
    command: sh -c "python init_db.py && flask run --host=0.0.0.0 --port=5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crime-watch-frontend
    environment:
      - BACKEND_API_URL=http://backend:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  crime_watch_pgdata:
