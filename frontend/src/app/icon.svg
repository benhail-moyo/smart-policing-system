<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background rounded plate for contrast across both light and dark browser tab themes -->
  <rect width="32" height="32" rx="7" fill="#0b1329" />
  
  <!-- Outer Shield -->
  <path d="M16 4.5L6.5 8.2V15C6.5 21 10.6 26.5 16 28C21.4 26.5 25.5 21 25.5 15V8.2L16 4.5Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="1.2" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Police Star Emblem -->
  <path d="M16 9.5L17.5 13.5L21.5 14L18.5 17L19.5 21L16 19L12.5 21L13.5 17L10.5 14L14.5 13.5L16 9.5Z" 
        fill="#f8fafc" 
        opacity="0.95" />
        
  <!-- Star Center Accent -->
  <circle cx="16" cy="16" r="1.5" fill="#38bdf8" />
</svg>
